<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方鼎 · 畫面規劃與流程示範</title>
  <link rel="stylesheet" href="board.css">
  <script src="board.js" defer></script>
</head>
<body>
  <header class="board-header"><a class="brand" href="index.html">Fangding <span>方鼎 / 畫面規劃板</span></a><nav aria-label="相關頁面"><a href="index.html">規劃文件</a><a href="demo.html">完整 Demo ↗</a></nav></header>
  <div class="board-layout">
    <aside class="page-sidebar"><p class="eyebrow">PAGES / 分類</p><nav id="page-nav" aria-label="畫面分類"></nav><div class="sidebar-note"><strong>先看規劃，再試操作</strong><p>Frame 並排比較畫面；示範流程帶客戶逐步操作。</p><p>縮圖為初始畫面參考。互動視窗共用當次假資料，重新整理即重置。</p></div></aside>
    <main class="board-main">
      <section class="board-intro"><div><p class="eyebrow">SCREEN PLANNING / 展示假資料</p><h1 id="page-title"></h1><p id="page-description"></p></div><button id="start-tour" class="primary">▶ 示範此流程</button></section>
      <div class="canvas-toolbar"><span id="frame-count"></span><div><button id="zoom-out" aria-label="縮小畫布">−</button><output id="zoom-label">70%</output><button id="zoom-in" aria-label="放大畫布">＋</button><button id="zoom-fit">適合畫面</button></div></div>
      <div id="canvas-viewport" tabindex="0" aria-label="畫面規劃畫布，可捲動；拖曳空白處移動畫布"><div id="canvas-size"><div id="frame-canvas"></div></div></div>
      <p class="canvas-help">拖曳空白處或使用捲軸移動畫布 · 點「操作此畫面」進入互動 · 流程箭頭表示操作順序</p>
      <p id="board-status" role="status" aria-live="polite"></p>
    </main>
  </div>
  <dialog id="player">
    <header class="player-header"><div><p class="eyebrow" id="player-mode">流程示範</p><h2 id="step-title"></h2></div><button id="close-player" aria-label="關閉示範">✕ 關閉</button></header>
    <div class="player-body"><section class="demo-stage"><iframe id="interactive-demo" src="demo.html?embed=1" title="可操作的方鼎庫存 Demo"></iframe></section><aside class="step-notes"><span id="step-counter" class="step-counter"></span><h3>這一步怎麼操作</h3><p id="step-instruction"></p><h3>預期結果</h3><p id="step-outcome"></p><div class="question"><h3>與客戶確認</h3><p id="step-question"></p></div><p class="player-hint">可直接填資料、按按鈕。上／下一步只切換畫面，不自動送出操作。關閉示範會取消未儲存表單，已完成操作會保留。</p><p id="player-status" role="status" aria-live="polite"></p></aside></div>
    <footer class="player-footer"><button id="previous-step">← 上一步</button><button id="return-board">返回全部 Frame</button><button id="next-step" class="primary">下一步 →</button></footer>
  </dialog>
</body>
</html>
