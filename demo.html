<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="方鼎庫存系統客戶展示：以假資料模擬 HIS 與 OTC 庫存操作。">
  <title>方鼎庫存系統 · Demo</title>
  <link rel="stylesheet" href="demo.css">
  <script src="demo.js" defer></script>
</head>
<body>
  <div class="demo-banner">展示模式・假資料 <span>重新整理即重置</span></div>
  <section id="login" class="login-layout">
    <div class="login-story"><div class="brand">Fangding <span>方鼎</span></div><p class="eyebrow">INVENTORY WORKSPACE</p><h1>讓庫存作業<br>清楚、有序。</h1><p>HIS 藥品查詢與維護、OTC 入出庫與領用，<br>在同一個工作平台掌握。</p><div class="login-tags"><span>HIS 藥品</span><span>OTC 庫存</span><span>掃碼盤點</span></div></div>
    <form id="login-form" class="login-card"><p class="eyebrow">歡迎使用方鼎</p><h2>登入工作區</h2><p class="muted">NAS LDAP 登入畫面模擬</p><label>帳號<input name="account" value="demo.pharmacy" autocomplete="off" required></label><label>密碼<input name="password" type="password" value="demo-only" autocomplete="off" required></label><button class="primary" type="submit">使用展示帳號登入 →</button><p class="muted small">此處僅驗證必填，不驗證真實帳密。請使用展示帳號。</p><a href="index.html">← 返回系統規劃</a></form>
  </section>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar" id="sidebar"><a class="brand" href="demo.html">Fangding <span>方鼎</span></a><p class="sidebar-caption">庫存管理工作區</p><nav id="module-nav" aria-label="功能選單"></nav><a class="planning-link" href="board.html">畫面規劃與流程示範 ↗</a><a class="planning-link" href="index.html">← 返回系統規劃</a><p class="small muted">所有操作僅影響當次假資料</p></aside>
    <div class="main-shell"><header class="topbar"><button id="menu-toggle" class="mobile-menu" aria-controls="sidebar" aria-expanded="false">☰ 功能選單</button><span id="workspace-label" class="workspace-label">共同工作區</span><div class="account"><span id="account-label"></span><button id="logout">登出</button></div></header><main id="content" tabindex="-1"></main></div>
  </div>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" data-close aria-label="關閉表單">✕</button></div><div id="editor-fields" class="form-grid"></div><p id="editor-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">儲存</button></div></form></dialog>
  <dialog id="confirmation"><form method="dialog"><h2>確認操作</h2><p id="confirmation-text"></p><div class="dialog-actions"><button value="cancel">取消</button><button value="confirm" class="primary">確認</button></div></form></dialog>
</body>
</html>
